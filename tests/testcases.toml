# Test cases for svg2tikz end-to-end conversion tests.
#
# Each [[tests]] entry converts an SVG and compares the result against an
# expected .tex file.  All paths are relative to the project root.
#
# Fields
# ──────
#   id                  unique identifier used in the test name and dependency graph
#   svg                 path to the input SVG file
#   expected            path to the expected .tex output
#   [options]           keyword arguments forwarded to convert_file()
#   depends_on          list of test IDs that must pass before this one runs
#   on_dependency_fail  "skip" (default) or "fail"
#
# When a dependency fails the dependent test is skipped (or failed) so the
# result list stays clean and you can see exactly which root cause broke things.
#
# To regenerate all expected .tex files run:
#   python scripts/generate_tex.py

# ── Shapes ────────────────────────────────────────────────────────────────────

[[tests]]
id = "rectangle"
svg = "tests/testfiles/shapes/rectangle.svg"
expected = "tests/testfiles/shapes/rectangle.tex"

[[tests]]
id = "rectangle_wrap"
svg = "tests/testfiles/shapes/rectangle_wrap.svg"
expected = "tests/testfiles/shapes/rectangle_wrap.tex"
depends_on = ["rectangle"]
[tests.options]
wrap = true

